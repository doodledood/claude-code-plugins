[project]
name = "claude-code-plugins"
version = "1.0.0"
requires-python = ">=3.10"

# The one place tool versions are pinned. `scripts/check.sh` and CI both resolve from here, so a
# local run and a CI run cannot disagree about which ruff or which mypy ran.
[dependency-groups]
dev = [
    "ruff==0.16.5",
    "mypy==1.18.2",
    "types-requests==2.32.4.20250913",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
files = [
    "claude-plugins/consultant/skills/consultant/scripts"
]
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by the formatter)
    "E402",  # module level import not at top (needed for sys.path manipulation)
    "SIM102", # nested if statements (often more readable)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "session_manager", "litellm_client", "model_selector", "response_strategy", "file_handler"]

[tool.ruff.format]
# ruff formats Python blocks embedded in Markdown as well as .py files. Those blocks are
# illustrative prose, and reformatting one inside claude-plugins/ would make a plugin version bump
# due for a change nobody asked for. Formatting applies to Python source only.
exclude = ["*.md"]
